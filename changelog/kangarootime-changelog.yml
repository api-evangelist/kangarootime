note: >-
  Kangarootime publishes dated product release notes as a section of its Zendesk help
  centre. Entry titles and dates below were read from the Zendesk Help Center API
  (https://kangarootimehelpk2.zendesk.com/api/v2/help_center/en-us/sections/42065337030932/articles.json),
  which answers anonymously; the rendered help-centre pages themselves sit behind a
  Cloudflare bot challenge and return 403 to a crawler. Entries are product-wide
  release notes for the end-user application - there is no API changelog, because
  there is no public API. `date` is the Zendesk article creation date; the title
  carries the release date the vendor announced.
