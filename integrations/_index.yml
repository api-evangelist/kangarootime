note: >-
  Listing-only catalog. Every entry carries `arazzo: null` because no forkable workflow
  can be authored - Arazzo requires verified operationIds on both sides, and
  Kangarootime publishes no OpenAPI at all. Nothing here is fabricated into a workflow.
  The direction field is the important finding: Kangarootime's integration surface is
  almost entirely INBOUND - it consumes partner APIs and partner-supplied credentials
  rather than exposing its own. The single outbound surface, Data Feeds, is a file push
  to storage the customer owns, not a callable API.
