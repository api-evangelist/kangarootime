note: >-
  Assessed against the cross-cutting standards this pipeline checks and against the
  `education` regulatory regime's standards list in scoring.yml (scim, lti, oneroster,
  ed-fi, caliper, qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref). Every
  conformance below is recorded as observed or NOT observed from Kangarootime's own
  public surface. Nothing is asserted on the strength of a marketing claim, and no
  conformance is invented to fill a slot - domain-standard conformance is reward-only,
  so an honest miss costs the provider nothing.
standards:
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI/Swagger document at any Kangarootime host. Probed /openapi.json,
    /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /redoc across
    kangarootime.com, k2, status, changelog, educator, insights - every 200 was an
    SPA catch-all returning identical bytes for a known-bad control path.
- id: graphql
