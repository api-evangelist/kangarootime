- id: apache-parquet
  conforms: true
  evidence: >-
    Data Feeds emits Apache Parquet as a first-class output format with configurable
    codec (Snappy/Gzip/LZ4/Zstd/Brotli), Zstd compression level 1-22 and Parquet
    version V1/V2, per the Data Feed User Guide. This is a real, open, machine-readable
    interchange format - the strongest standards signal Kangarootime publishes.
- id: ndjson
  conforms: true
  evidence: >-
    Data Feeds emits newline-delimited JSON when "Output as Array" is disabled (the
    default), and a single JSON array when enabled. Documented with examples in the guide.
- id: csv
  conforms: true
  evidence: >-
    Data Feeds emits RFC-4180-shaped CSV with configurable delimiter, quote character,
    escape character and header row.
domain_standard:
  declared: false
  candidates_checked: [scim, lti, oneroster, ed-fi, caliper, qti, oai-pmh, shibboleth, saml]
  finding: >-
    Kangarootime's market - early-childhood education and childcare management - has
    real interchange standards (OneRoster and Ed-Fi for rostering/enrollment, SCIM for
    identity) and Kangarootime declares none of them in any published contract. Its
    only standards-shaped commitment is at the file-format layer: Parquet, NDJSON and
    CSV. A buyer who already speaks OneRoster or Ed-Fi gets no shortcut here and needs
    a bespoke connector built against the proprietary 63-table feed schema.
  note: >-
    Reward-only dimension. Recorded as not-declared, not as a failure. The one
    domain-specific interchange Kangarootime DOES perform is with KinderConnect, the
    state child-care subsidy attendance system - but that is a partner-built inbound
    integration configured in-app, with no published contract, so it cannot be scored
    as a declared standard.
compliance_program:
  published: false
  evidence: >-
    kangarootime.com/security -> 404, kangarootime.com/trust -> 404. No trust centre,
    no SOC 2 / ISO 27001 / PCI DSS / HIPAA / FedRAMP certification claim found on any
    public page. probe-security-programs.py returned vdp=none trust=none. No
    `Compliance` or `TrustCenter` pointer is therefore wired in apis.yml.
  note: >-
    Notable given the product processes childrens records and card payments. Payment
    processing is delegated: payrix.kangarootime.com (HTTP 200) serves Worldpay
    content, and a test-payrixapi.kangarootime.com host appears in certificate
    transparency logs, so card-data PCI obligations largely sit with Worldpay/Payrix
    rather than with Kangarootime. Kangarootime still publishes no statement of its
    own security or compliance posture.
