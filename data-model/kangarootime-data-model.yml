note: >-
  Kangarootime publishes no OpenAPI, so this entity model is NOT derived from a
  contract. It is read from the vendor's own public "Kangarootime Data Feed - Table
  schema and domain model reference", served openly and without credentials at
  data-feed.kangarootime.com. That reference is the closest thing Kangarootime
  publishes to a machine-readable description of its domain, and it is the schema a
  customer's BI platform actually binds to.
delivery_model: bulk-export
delivery_note: >-
  This is a warehouse feed, not an API. Kangarootime pushes files to storage the
  CUSTOMER owns; nothing here is a callable endpoint and no Kangarootime host accepts
  a query. See conventions/kangarootime-conventions.yml for the delivery contract.
