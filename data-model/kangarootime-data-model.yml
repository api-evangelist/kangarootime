observations:
- >-
  Four tables carry a `_non_conformed` suffix (fct_employee_shift_non_conformed,
  fct_session_subsidy_non_conformed, fct_session_time_entry_non_conformed) - the
  vendor is signalling, in the schema itself, that these facts are not conformed to
  the shared dimensions. A consumer joining them to dim_date or dim_staff should not
  assume the usual grain holds.
- >-
  There is no dim_user / dim_login and no audit or event fact table. The feed
  describes business state, not system activity, so it cannot answer who changed what.
