coverage_limit: >-
  Table names and their type classification are recorded. Per-column detail (column
  names, data types, nullability, key roles) was NOT harvested: the individual table
  pages describe records about children and families, and crawling them was out of
  scope for this pass. Column counts are published per table on the reference index
  for anyone who needs them. Treat this artifact as an inventory of the domain, not
  as a column-level dictionary.
data_sensitivity:
  classification: high
  subjects: [children, parents/guardians, staff]
  note: >-
    The feed carries identified records about minors (dim_student,
    dim_application_student, enrollment and attendance facts) together with
    guardian/account contacts and staff employment history. A customer configuring a
    Data Feed is exporting children's records into their own cloud bucket and assumes
    the controller obligations that come with it. Kangarootime publishes no data
    processing addendum, retention statement or field-level sensitivity classification
    alongside the schema reference.
