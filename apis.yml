aid: kangarootime
name: Kangarootime
description: 'Kangarootime is a cloud-based childcare and early-education management
  platform for single-site and multi-location centers, franchises and after-school
  programs. The product covers enrollment and lead management, family and staff records,
  classroom and rooming, attendance and check-in/out kiosks, curriculum and lesson
  planning, parent communication, tuition billing, subsidy administration and integrated
  payment processing, plus reporting dashboards (Insights) and an educator training
  LMS. Kangarootime publishes no public REST, GraphQL or SOAP API and runs no developer
  program; its customer-facing data integration surface is "Data Feeds", a configurable
  daily bulk export of the platform''s 63-table dimensional warehouse schema to a customer-owned
  AWS S3, Azure Blob or Google Cloud Storage bucket in CSV, JSON/NDJSON, Parquet or
  XLSX, with the table and domain-model reference published openly at data-feed.kangarootime.com.'
