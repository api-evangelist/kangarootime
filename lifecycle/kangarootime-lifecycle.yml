note: >-
  Kangarootime publishes no API, so there is no API versioning scheme, no deprecation
  policy, no Sunset/Deprecation header contract and no deprecated operations to
  derive. What it does publish is an application status page and a dated release-notes
  stream. Both are recorded here; the absent fields are recorded as absent rather
  than omitted, so a reader can tell "checked, not published" from "not checked".
